<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>TESLA</title>
  </head>
  <body>
    <img src="./logo.png" alt="logo da tesla" class="logo" />

    <ul class="lista">
      <li class="item">
        <video src="./tesla.mp4" muted autoplay loop></video>

        <div class="info carro">
          <h1>Model Y</h1>
          <p class="sub-titulo">Parcela a partir de 4,999 dólares</p>
        </div>

        <div class="rodape">
          <button onclick="aparecerFormulario()">Comprar Agora</button>
          <p class="text-rodape">Não garantimos seu veiculo imediatamente</p>
        </div>
      </li>

      <li class="item">
        <img src="./model-3.png" class="imagem-tesla" alt="imagem model 3" />

        <div class="info-carro">
          <h1>Model 3</h1>
          <p class="sub-titulo">Compre agora o seu Tesla</p>
        </div>
      </li>

      <li class="item">
        <img src="./model-x.png" class="imagem-tesla" alt="imagem model x" />

        <div class="info-carro">
          <h1>Model X</h1>
          <p class="sub-titulo">Parcelas a partir de 4,900 dólares</p>
        </div>
      </li>
    </ul>

    <div class="formulario" id="formulario">
      <button class="fechar" onclick="desaparecerFormulario()">✖</button>
      <h2>Compre seu Tesla</h2>
      <form autocomplete="off">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required />

        <label for="email">E-mail:</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="off"
        />
        <label for="modelo">Modelo:</label>
        <select id="modelo" name="modelo">
          <option value="model-y">Model Y</option>
          <option value="model-3">Model 3</option>
          <option value="model-x">Model X</option>
        </select>

        <button type="submit" class="enviar">Enviar</button>
      </form>
    </div>
  </body>
  <script src="scripts.js"></script>
</html>
